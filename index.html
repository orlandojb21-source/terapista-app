
<script>
const COLORS = ['#534AB7','#1D9E75','#D4537E','#BA7517','#3B82F6','#7C3AED','#059669','#DC2626'];
const API_URL = "https://script.google.com/macros/s/AKfycbzBcqp0mU6UvxhbrTG51OJQSeGT3sPROrmRsK-bCfTpE5f7ARwTdhaPkPeERgnzp4MGJw/exec";

let pacientes = [], sesiones = [], agencias = [], planData = {}, tiposConfig = [];
let currentScreen = 'hoy';
let calMonth = new Date().getMonth(), calYear = new Date().getFullYear(), selDay = null;
let repMonth = new Date().getMonth(), repYear = new Date().getFullYear();
let repWeekOffset = 0, repTab = 'semanal';
let editingPacId = null, selectedDur = 30;
let regStep = 1, regTipo = 'normal';
let regPacientes = [];
let filtroNinos = 'todos', searchNinos = '', searchPacs = '';
let diasLibres = [];

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// ── C5: XSS prevention — escape all Sheet data before innerHTML ──
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str === null || str === undefined ? '' : String(str);
  return d.innerHTML;
}

// ── C1: module-level token vars (not window) ──
let _idToken = null;
let _calendarToken = null; // A1 fix: was window._calendarToken

function apiGet(params) {
  const url = new URL(API_URL);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  if (_idToken) url.searchParams.set('idToken', _idToken); // C1
  return fetch(url.toString()).then(r => r.json());
}
function apiPost(body) {
  const flat = { action: body.action };
  if (body.data)     Object.assign(flat, body.data);
  if (body.id)       flat.id = body.id;
  if (body.nombre)   flat.nombre = body.nombre;
  if (body.data_str) flat.data = body.data_str;
  if (_idToken) flat.idToken = _idToken; // C1
  const url = new URL(API_URL);
  Object.entries(flat).forEach(([k,v]) => url.searchParams.set(k, String(v)));
  return fetch(url.toString()).then(r => r.json());
}

async function init() {
  document.getElementById('screen-hoy').innerHTML = '<div class="loading"><div class="spinner"></div><p style="font-size:13px;color:var(--sub)">Cargando datos...</p></div>';
  updateHeader('hoy');
  const emailTerapista = (currentUser.rol === 'admin' && terapistaActiva) ? terapistaActiva : currentUser.email;
  try {
    const [rPac, rSes, rAg, rPlan, rConf2, rDL] = await Promise.all([
      apiGet({ action:'getPacientes', email: emailTerapista }),
      apiGet({ action:'getSesiones', email: emailTerapista }),
      apiGet({ action:'getAgencias' }),
      apiGet({ action:'getPlanificacion', email: emailTerapista }),
      apiGet({ action:'getConfig2' }),
      apiGet({ action:'getDiasLibres', email: emailTerapista })
    ]);
    if (rPac.success)  pacientes   = rPac.data  || [];
    if (rSes.success)  sesiones    = rSes.data  || [];
    if (rAg.success)   agencias    = rAg.data   || [];
    if (rPlan.success) planData    = rPlan.data  || {};
    if (rConf2 && rConf2.success) tiposConfig = rConf2.data || [];
    if (rDL && rDL.success) diasLibres = rDL.data || [];
    populateSelects(); populateAgencias(); populateProgramas();
    showToast('\u2705 Datos cargados');
  } catch(e) {
    showToast('\u26a0\ufe0f Error: ' + e.message);
    pacientes = []; sesiones = [];
    populateSelects();
  }
  renderHoy();
}

function today() {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmt(s) {
  if (!s) return '\u2014';
  const [y,m,d] = s.split('-');
  return d+'/'+m+'/'+y;
}
function edad(dob) {
  if (!dob) return '\u2014';
  const d = new Date(dob), now = new Date();
  let y = now.getFullYear()-d.getFullYear();
  if (now < new Date(now.getFullYear(),d.getMonth(),d.getDate())) y--;
  return y+' a\u00f1o'+(y!==1?'s':'');
}
function initials(n) { return (n||'').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase(); }
function colorFor(id) {
  let h = 0;
  for (let i=0; i<(id||'').length; i++) h = (h<<5)-h+id.charCodeAt(i);
  return COLORS[Math.abs(h) % COLORS.length];
}
function dotColor(tipo) {
  if (tipo === 'Normal')       return '#1D9E75';
  if (tipo === 'Recuperacion') return '#BA7517';
  if (tipo === 'Cancelada')    return '#D4537E';
  return '#AFA9EC';
}
function sesionesRealizadas(pacId) {
  return sesiones.filter(s=>s.PacienteID===pacId&&(s.Tipo==='Normal'||s.Tipo==='Recuperacion')).length;
}
function sesionesRestantes(pac) { return Math.max(0, parseInt(pac.TotalSesiones)-sesionesRealizadas(pac.ID)); }
function getStatus(pac) { const r=sesionesRestantes(pac); return r<=5?'alert':r<=10?'warn':'ok'; }
function hasCancelaciones(pacId) { return sesiones.some(s=>s.PacienteID===pacId&&s.Tipo==='Cancelada'); }
function sesionesDelDia(dateStr) { return sesiones.filter(s=>s.Fecha===dateStr).sort((a,b)=>a.HoraInicio.localeCompare(b.HoraInicio)); }
function chipHTML(tipo) {
  if (tipo==='Normal')       return '<span class="chip chip-done">Realizada</span>';
  if (tipo==='Recuperacion') return '<span class="chip chip-recovery">\ud83d\udd04 Recuperaci\u00f3n</span>';
  if (tipo==='Cancelada')    return '<span class="chip chip-cancel">Cancelada</span>';
  return '';
}
function barClass(pac) { const s=getStatus(pac); return s==='alert'?'alert':s==='warn'?'warn':''; }
function showToast(msg,dur=2500) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),dur);
}
function calcHoras(lista) {
  let min=0;
  lista.forEach(s=>{
    if(s.HoraInicio&&s.HoraFin&&s.HoraFin!=='0:00'&&s.HoraFin!=='00:00'){
      const[h1,m1]=s.HoraInicio.split(':').map(Number);
      const[h2,m2]=s.HoraFin.split(':').map(Number);
      const diff=(h2*60+m2)-(h1*60+m1);
      if(diff>0) min+=diff;
    }
  });
  return Math.round(min/60*10)/10;
}
function resumenCards(realizadas,canceladas,recuperaciones,horas) {
  return `<div class="card-grid">
    <div class="stat-card"><div class="num">${realizadas}</div><div class="lbl">Realizadas</div></div>
    <div class="stat-card"><div class="num">${canceladas}</div><div class="lbl">Cancelaciones</div></div>
    <div class="stat-card"><div class="num">${recuperaciones}</div><div class="lbl">Recuperaciones</div></div>
    <div class="stat-card"><div class="num">${horas}h</div><div class="lbl">Horas</div></div>
  </div>`;
}
function barChart(datos,colorFn) {
  const max=Math.max(...datos.map(d=>d.val),1);
  return '<div class="bar-chart">'+datos.map(d=>`<div class="bc">
    <div class="bc-num">${d.val||''}</div>
    <div class="bc-fill" style="height:${Math.round((d.val/max)*50)+5}px;background:${d.val?colorFn(d):'var(--lav-light)'}"></div>
    <div class="bc-lbl">${esc(d.lbl)}</div></div>`).join('')+'</div>';
}

function populateSelects() {
  const activos = [...pacientes].filter(p=>p.Estado!=='inactivo').sort((a,b)=>(a.Nombre||'').localeCompare(b.Nombre||''));
  // C5: esc() on IDs and names in option values
  const opts = activos.map(p=>`<option value="${esc(p.ID)}">${esc(p.Nombre)}</option>`).join('');
  document.getElementById('reg-paciente').innerHTML = '<option value="">— Elige un ni\u00f1o —</option>'+opts;
  document.getElementById('rep-paciente').innerHTML = '<option value="">— Elige un ni\u00f1o —</option>'+opts;
}

function populateAgencias() {
  const sel = document.getElementById('fp-agencia');
  if (!sel) return;
  const current = sel.value;
  sel.innerHTML = '<option value="">— Selecciona una agencia —</option>';
  agencias.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    if (a===current) opt.selected=true;
    sel.appendChild(opt);
  });
  const opt = document.createElement('option');
  opt.value='__gestionar__'; opt.textContent='\u2699\ufe0f Gestionar agencias...';
  sel.appendChild(opt);
  sel.onchange = function() {
    if (this.value==='__gestionar__') { this.value=current; abrirGestionAgencias(); }
  };
}
function populateProgramas() {
  const sel = document.getElementById('fp-tipo');
  if (!sel) return;
  const current = sel.value;
  sel.innerHTML = '<option value="">— Selecciona un programa —</option>';
  tiposConfig.forEach(function(t) {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    if (t === current) opt.selected = true;
    sel.appendChild(opt);
  });
  const opt = document.createElement('option');
  opt.value = '__gestionar__'; opt.textContent = '\u2699\ufe0f Gestionar programas...';
  sel.appendChild(opt);
  sel.onchange = function() {
    if (this.value === '__gestionar__') { this.value = current; abrirGestionProgramas(); }
  };
}

function abrirGestionProgramas() { renderProgramasList(); openOv('ov-programas'); }
function renderProgramasList() {
  const el = document.getElementById('programas-list');
  if (!tiposConfig.length) { el.innerHTML = '<div class="empty">No hay programas registrados</div>'; return; }
  // C5: esc() on program names
  el.innerHTML = tiposConfig.map(t => `<div class="patient-row" style="padding:10px 14px">
    <div class="p-info"><div class="p-name">${esc(t)}</div></div>
    <button onclick="eliminarPrograma('${esc(t)}')" style="background:var(--red-light);color:var(--red);border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px">\ud83d\uddd1\ufe0f</button>
  </div>`).join('');
}
async function agregarPrograma() {
  const input = document.getElementById('nuevo-programa-input');
  const nombre = input.value.trim();
  if (!nombre) { showToast('\u26a0\ufe0f Escribe el nombre'); return; }
  if (tiposConfig.includes(nombre)) { showToast('\u26a0\ufe0f Ya existe'); return; }
  showToast('Guardando...');
  try {
    await apiGet({ action: 'agregarPrograma', nombre });
    tiposConfig.push(nombre); input.value = '';
    renderProgramasList(); populateProgramas(); showToast('\u2705 Programa agregado');
  } catch(e) { showToast('\u26a0\ufe0f Error: ' + e.message); }
}
async function eliminarPrograma(nombre) {
  showToast('Eliminando...');
  try {
    await apiGet({ action: 'eliminarPrograma', nombre });
    tiposConfig = tiposConfig.filter(t => t !== nombre);
    renderProgramasList(); populateProgramas(); showToast('\u2705 Programa eliminado');
  } catch(e) { showToast('\u26a0\ufe0f Error: ' + e.message); }
}

const SCREENS = {hoy:'screen-hoy',registro:'screen-registro',plan:'screen-plan',mes:'screen-mes',ninos:'screen-ninos',pacientes:'screen-pacientes',reportes:'screen-reportes'};
const NAV_ORDER = ['registro','hoy','plan','mes','ninos','pacientes','reportes'];

function navTo(screen) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(SCREENS[screen]).classList.add('active');
  document.querySelectorAll('.nav-item').forEach((b,i)=>b.classList.toggle('active',NAV_ORDER[i]===screen));
  document.querySelectorAll('.sidebar-item').forEach((b,i)=>b.classList.toggle('active',NAV_ORDER[i]===screen));
  currentScreen = screen;
  updateHeader(screen);
  if (screen==='hoy')            renderHoy();
  else if (screen==='plan')      renderPlan();
  else if (screen==='mes')       renderMes();
  else if (screen==='ninos')     renderNinos();
  else if (screen==='pacientes') renderPacientes();
  else if (screen==='reportes')  renderReportes();
  recargarDatos();
}

function updateHeader(screen) {
  const el = document.getElementById('main-header');
  if (!el) return;
  const now = new Date();
  const dias = ['Domingo','Lunes','Martes','Mi\u00e9rcoles','Jueves','Viernes','S\u00e1bado'];
  if (screen==='hoy') {
    el.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between">
      <div>
        <p style="font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:0.5px">${esc(dias[now.getDay()])}, ${now.getDate()} de ${esc(MESES[now.getMonth()])} ${now.getFullYear()}</p>
        <h1 style="font-size:17px;color:var(--text);font-weight:500;margin-top:2px">Appointment Scheduling</h1>
        <p style="font-size:12px;color:var(--sub);margin-top:1px">Speech Therapist</p>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
        <span style="font-size:14px;font-weight:500;color:var(--lav)">${esc(currentUser?currentUser.name:'Stacy Saavedra')}</span>
        <button onclick="recargarManual()" style="background:var(--lav-light);border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:14px;color:var(--lav);display:flex;align-items:center;justify-content:center">\u21bb</button>
      </div></div>`;
  } else if (screen==='mes') {
    el.innerHTML = `<div style="display:flex;align-items:center;gap:8px">
      <h1 style="font-size:18px;color:var(--text);flex:1">Calendario</h1>
      <div class="month-nav">
        <button onclick="changeCalMonth(-1)">\u2039</button>
        <span id="cal-month-lbl">${esc(MESES[calMonth])} ${calYear}</span>
        <button onclick="changeCalMonth(1)">\u203a</button>
      </div></div>`;
  } else if (screen==='pacientes') {
    el.innerHTML = `<div style="display:flex;align-items:center;gap:8px">
      <h1 style="font-size:18px;color:var(--text);flex:1">Pacientes</h1>
      <button class="btn-add" onclick="abrirNuevoPaciente()"><i class="fas fa-plus"></i> Nuevo</button></div>`;
  } else if (screen==='reportes') {
    el.innerHTML = `<div style="display:flex;align-items:center;gap:8px">
      <h1 style="font-size:18px;color:var(--text);flex:1">Reportes</h1>
      <div class="month-nav">
        <button onclick="changeRepMonth(-1)">\u2039</button>
        <span id="rep-month-lbl">${esc(MESES[repMonth])} ${repYear}</span>
        <button onclick="changeRepMonth(1)">\u203a</button>
      </div></div>`;
  } else {
    const labels = {registro:'Registrar sesi\u00f3n',plan:'Planificaci\u00f3n semanal',ninos:'Ni\u00f1os activos'};
    el.innerHTML = `<h1 style="font-size:18px;color:var(--text)">${esc(labels[screen]||screen)}</h1>`;
  }
}

function renderHoy() {
  const t = today();
  const sesDia = sesionesDelDia(t);
  const realizadas = sesDia.filter(s=>s.Tipo==='Normal'||s.Tipo==='Recuperacion').length;
  const canceladas = sesDia.filter(s=>s.Tipo==='Cancelada').length;
  const recuperaciones = sesDia.filter(s=>s.Tipo==='Recuperacion').length;
  // C5: esc() on patient names in alerts
  const alertas = pacientes.filter(p=>p.Estado!=='inactivo'&&sesionesRestantes(p)<=5).map(p=>
    `<div class="alert-card">\u26a0\ufe0f <strong>${esc(p.Nombre.split(' ')[0])}</strong> le quedan solo ${sesionesRestantes(p)} sesiones</div>`
  ).join('');
  const diaLibreHoy = diasLibres.find(d=>d.Fecha===t);
  const diaLibreHTML = diaLibreHoy
    ? `<div style="background:#FFF3CD;border:0.5px solid #FAC775;border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:8px">
        <span style="font-size:18px">${diaLibreHoy.Tipo==='Feriado'?'\ud83c\udf89':diaLibreHoy.Tipo==='Incapacidad'?'\ud83e\udd12':'\ud83c\udfd6\ufe0f'}</span>
        <div>
          <div style="font-size:13px;font-weight:500;color:#633806">${esc(diaLibreHoy.Tipo)}</div>
          ${diaLibreHoy.Notas?`<div style="font-size:11px;color:#633806;margin-top:2px">${esc(diaLibreHoy.Notas)}</div>`:''}
        </div>
      </div>` : '';
  const sesHTML = sesDia.length ? sesDia.map(s=>{
    const pac=pacientes.find(p=>p.ID===s.PacienteID)||{};
    const nombre=pac.Nombre||'Paciente desconocido';
    const notasResumen=s.Notas?(s.Notas.length>60?s.Notas.substring(0,60)+'...':s.Notas):'';
    // C5: esc() on session data
    return `<div class="session-item" onclick="abrirEditarSesion('${esc(s.ID)}')" style="cursor:pointer">
      <span class="s-time">${esc(s.HoraInicio)}</span>
      <div class="s-dot" style="background:${dotColor(s.Tipo)}"></div>
      <div class="s-info">
        <div class="s-name">${esc(nombre)}${s.Tipo==='Recuperacion'?' \ud83d\udd04':''}</div>
        ${notasResumen?`<div class="s-sub">${esc(notasResumen)}</div>`:''}
      </div>
      ${chipHTML(s.Tipo)}
      <i class="fas fa-pen" style="font-size:11px;color:var(--lav-pale);margin-left:4px"></i>
    </div>`;
  }).join('') : '<div class="empty">Sin sesiones registradas hoy</div>';
  document.getElementById('screen-hoy').innerHTML = `
    <div class="section-lbl">Resumen de hoy</div>
    <div class="card-grid">
      <div class="stat-card"><div class="num">${sesDia.length}</div><div class="lbl">Sesiones hoy</div></div>
      <div class="stat-card"><div class="num">${realizadas}</div><div class="lbl">Completadas</div></div>
      <div class="stat-card"><div class="num">${canceladas}</div><div class="lbl">Canceladas</div></div>
      <div class="stat-card"><div class="num">${recuperaciones}</div><div class="lbl">Recuperaciones</div></div>
    </div>
    ${diaLibreHTML}${alertas}
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <div class="section-lbl" style="margin:0">Agenda del d\u00eda</div>
      <button onclick="abrirModalDiaLibre()" style="background:var(--amber-light);border:0.5px solid #FAC775;border-radius:20px;padding:5px 12px;font-size:11px;color:#633806;cursor:pointer;font-family:Georgia,serif">\ud83c\udfd6\ufe0f D\u00eda libre</button>
    </div>
    <div class="card">${sesHTML}</div>`;
}

function abrirEditarSesion(id) {
  const s=sesiones.find(x=>x.ID===id); if(!s) return;
  const pac=pacientes.find(x=>x.ID===s.PacienteID);
  document.getElementById('edit-ses-id').value=id;
  document.getElementById('edit-ses-pac').textContent=pac?pac.Nombre:'Paciente desconocido';
  document.getElementById('edit-ses-fecha').value=s.Fecha;
  document.getElementById('edit-ses-inicio').value=s.HoraInicio;
  document.getElementById('edit-ses-fin').value=s.HoraFin;
  document.getElementById('edit-ses-tipo').value=s.Tipo;
  document.getElementById('edit-ses-notas').value=s.Notas||'';
  openOv('ov-edit-sesion');
}
async function guardarEdicionSesion() {
  const id=document.getElementById('edit-ses-id').value;
  const data={ID:id,Fecha:document.getElementById('edit-ses-fecha').value,
    HoraInicio:document.getElementById('edit-ses-inicio').value,
    HoraFin:document.getElementById('edit-ses-fin').value,
    Tipo:document.getElementById('edit-ses-tipo').value,
    Notas:document.getElementById('edit-ses-notas').value};
  showToast('Guardando cambios...');
  try {
    await apiPost({action:'editarSesion',data});
    const idx=sesiones.findIndex(x=>x.ID===id);
    if(idx>=0) sesiones[idx]={...sesiones[idx],...data};
    closeOv('ov-edit-sesion'); showToast('\u2705 Sesi\u00f3n actualizada'); recargarDatos();
  } catch(e) { showToast('\u26a0\ufe0f Error: '+e.message); }
}
async function eliminarSesion() {
  const id=document.getElementById('edit-ses-id').value;
  showToast('Eliminando sesi\u00f3n...');
  try {
    await apiPost({action:'eliminarSesion',id});
    sesiones=sesiones.filter(x=>x.ID!==id);
    closeOv('ov-edit-sesion'); showToast('\u2705 Sesi\u00f3n eliminada'); recargarDatos();
  } catch(e) { showToast('\u26a0\ufe0f Error: '+e.message); }
}

function abrirGestionAgencias() { renderAgenciasList(); openOv('ov-agencias'); }
function renderAgenciasList() {
  const el=document.getElementById('agencias-list');
  if(!agencias.length){el.innerHTML='<div class="empty">No hay agencias registradas</div>';return;}
  // C5: esc() on agency names
  el.innerHTML=agencias.map(a=>`<div class="patient-row" style="padding:10px 14px">
    <div class="p-info"><div class="p-name">${esc(a)}</div></div>
    <button onclick="eliminarAgencia('${esc(a)}')" style="background:var(--red-light);color:var(--red);border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px">\ud83d\uddd1\ufe0f</button>
  </div>`).join('');
}
async function agregarAgencia() {
  const input=document.getElementById('nueva-agencia-input');
  const nombre=input.value.trim();
  if(!nombre){showToast('\u26a0\ufe0f Escribe el nombre');return;}
  if(agencias.includes(nombre)){showToast('\u26a0\ufe0f Ya existe');return;}
  showToast('Guardando...');
  try {
    await apiPost({action:'agregarAgencia',nombre});
    agencias.push(nombre); input.value='';
    renderAgenciasList(); populateAgencias(); showToast('\u2705 Agencia agregada');
  } catch(e) { showToast('\u26a0\ufe0f Error: '+e.message); }
}
async function eliminarAgencia(nombre) {
  showToast('Eliminando...');
  try {
    await apiPost({action:'eliminarAgencia',nombre});
    agencias=agencias.filter(a=>a!==nombre);
    renderAgenciasList(); populateAgencias(); showToast('\u2705 Agencia eliminada');
  } catch(e) { showToast('\u26a0\ufe0f Error: '+e.message); }
}
async function recargarManual() { showToast('\ud83d\udd04 Recargando...'); await recargarDatos(); showToast('\u2705 Actualizado'); }

function changeCalMonth(dir) {
  calMonth+=dir;
  if(calMonth<0){calMonth=11;calYear--;}
  if(calMonth>11){calMonth=0;calYear++;}
  document.getElementById('cal-month-lbl').textContent=`${MESES[calMonth]} ${calYear}`;
  renderMes();
}
function renderMes() {
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const todayD=new Date();
  const isThisMonth=todayD.getFullYear()===calYear&&todayD.getMonth()===calMonth;
  let calHTML=`<div class="weekdays"><span>D</span><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span></div><div class="cal-grid">`;
  for(let i=0;i<firstDay;i++) calHTML+=`<div class="cal-day"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const daySes=sesionesDelDia(dateStr);
    const isToday=isThisMonth&&d===todayD.getDate();
    const isSel=selDay===dateStr;
    const hasCan=daySes.some(s=>s.Tipo==='Cancelada')&&!daySes.some(s=>s.Tipo!=='Cancelada');
    const diaLibre=diasLibres.find(dl=>dl.Fecha===dateStr);
    let cls='cal-day';
    if(isToday) cls+=' today'; else if(isSel) cls+=' selected'; else if(diaLibre) cls+=' has-libre'; else if(hasCan) cls+=' has-cancel';
    const dots=daySes.slice(0,3).map(s=>`<div class="cal-dot" style="background:${isToday?'rgba(255,255,255,0.7)':dotColor(s.Tipo)}"></div>`).join('');
    calHTML+=`<div class="${cls}" onclick="selectCalDay('${dateStr}')"><span class="dn">${d}</span><div class="cal-dots">${dots}</div></div>`;
  }
  calHTML+=`</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 8px;font-size:10px;color:var(--sub)">
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lav);margin-right:3px"></span>Hoy</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mint);margin-right:3px"></span>Sesiones</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red-light);border:1px solid #E8A598;margin-right:3px"></span>Solo cancelaciones</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber-light);border:1px solid #FAC775;margin-right:3px"></span>D\u00eda libre</span>
  </div>`;
  if(selDay){
    const daySes2=sesionesDelDia(selDay);
    const[sy,sm,sd]=selDay.split('-');
    const diasSem=['Domingo','Lunes','Martes','Mi\u00e9rcoles','Jueves','Viernes','S\u00e1bado'];
    const wday=diasSem[new Date(selDay).getDay()];
    const diaLibreSel=diasLibres.find(dl=>dl.Fecha===selDay);
    const diaLibreSelHTML=diaLibreSel?`<div style="background:var(--amber-light);border:0.5px solid #FAC775;border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px">
      <span style="font-size:16px">${diaLibreSel.Tipo==='Feriado'?'\ud83c\udf89':diaLibreSel.Tipo==='Incapacidad'?'\ud83e\udd12':'\ud83c\udfd6\ufe0f'}</span>
      <div><div style="font-size:12px;font-weight:500;color:#633806">${esc(diaLibreSel.Tipo)}</div>
      ${diaLibreSel.Notas?`<div style="font-size:11px;color:#633806">${esc(diaLibreSel.Notas)}</div>`:''}</div>
      </div>`:'';
    const sesHTML2=daySes2.length?daySes2.map(s=>{
      const pac=pacientes.find(p=>p.ID===s.PacienteID)||{};
      return `<div class="session-item">
        <span class="s-time">${esc(s.HoraInicio)}</span>
        <div class="s-dot" style="background:${dotColor(s.Tipo)}"></div>
        <div class="s-info"><div class="s-name">${esc(pac.Nombre||'\u2014')}${s.Tipo==='Recuperacion'?' \ud83d\udd04':''}</div><div class="s-sub">${esc(s.Lugar||'')}</div></div>
        ${chipHTML(s.Tipo)}</div>`;
    }).join(''):'<div class="empty" style="padding:14px">Sin sesiones</div>';
    calHTML+=`<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="font-size:13px;font-weight:500;color:var(--text)">${esc(wday)} ${esc(sd)}/${esc(sm)}</div>
      <button onclick="abrirModalDiaLibre('${selDay}')" style="background:var(--amber-light);border:0.5px solid #FAC775;border-radius:20px;padding:4px 10px;font-size:11px;color:#633806;cursor:pointer;font-family:Georgia,serif">\ud83c\udfd6\ufe0f D\u00eda libre</button>
      </div>${diaLibreSelHTML}${sesHTML2}</div>`;
  }
  document.getElementById('screen-mes').innerHTML=calHTML;
}
function selectCalDay(dateStr){selDay=selDay===dateStr?null:dateStr;renderMes();}

function renderNinos() {
  const list=pacientes.filter(p=>{
    if(p.Estado==='inactivo') return false;
    const matchSearch=p.Nombre.toLowerCase().includes(searchNinos.toLowerCase());
    const s=getStatus(p);
    const hasCan=hasCancelaciones(p.ID);
    const matchFilter=filtroNinos==='todos'||
      (filtroNinos==='ok'&&s==='ok')||
      (filtroNinos==='warn'&&(s==='warn'||s==='alert'))||
      (filtroNinos==='cancel'&&hasCan);
    return matchSearch&&matchFilter;
  });
  if(!list.length){document.getElementById('ninos-list').innerHTML='<div class="empty">No se encontraron ni\u00f1os</div>';return;}
  // C5: esc() on patient data
  document.getElementById('ninos-list').innerHTML=list.map(p=>{
    const rem=sesionesRestantes(p);
    return `<div class="patient-row" onclick="abrirDetalleNino('${esc(p.ID)}')">
      <div style="width:36px;height:36px;border-radius:50%;background:var(--lav-light);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <i class="fas fa-child" style="color:var(--lav);font-size:16px"></i>

        <div class="p-sub">${esc(edad(p.FechaNacimiento))} \u00b7 ${esc(p.LugarAtencion)}</div>
        <span class="dur-badge ${parseInt(p.DuracionMin)===30?'dur-30':'dur-60'}">${parseInt(p.DuracionMin)===30?'\u23f1 30 min':'\ud83d\udd50 1 hora'}</span>
      </div>

      <i class="fas fa-chevron-right" style="color:var(--lav-pale);font-size:14px"></i>

async function guardarPaciente() {
  const nombre=document.getElementById('fp-nombre').value.trim();
  if(!nombre){showToast('\u26a0\ufe0f El nombre es obligatorio');return;}
  const data={Nombre:nombre,FechaNacimiento:document.getElementById('fp-dob').value,
    LugarAtencion:document.getElementById('fp-lugar').value,
    Contacto:document.getElementById('fp-contacto').value,
    Telefono:document.getElementById('fp-tel').value,
    TotalSesiones:document.getElementById('fp-total').value,
    DuracionMin:selectedDur,Observaciones:document.getElementById('fp-obs').value,
    Agencia:document.getElementById('fp-agencia').value,
    Programa:document.getElementById('fp-tipo').value,
    Precio:document.getElementById('fp-precio').value,
    TerapistaEmail: currentUser.email};
  showToast('Guardando...');
  try {
    if(editingPacId){
      data.ID=editingPacId;
      await apiPost({action:'editarPaciente',data});
      const idx=pacientes.findIndex(x=>x.ID===editingPacId);
      if(idx>=0) pacientes[idx]={...pacientes[idx],...data};
    } else {
      const r=await apiPost({action:'agregarPaciente',data});
      if(r.success){data.ID=r.id;pacientes.push(data);}
    }
    populateSelects(); renderPacientes();
    closeOv('ov-form-pac'); closeOv('ov-pac');
    showToast('\u2705 Paciente guardado'); recargarDatos();
  } catch(e){showToast('\u26a0\ufe0f Error: '+e.message);}
}
async function desactivarPaciente() {
  if(!editingPacId) return;
  showToast('Archivando paciente...');
  try {
    await apiPost({action:'desactivarPaciente',id:editingPacId});
    const p=pacientes.find(x=>x.ID===editingPacId);
    if(p) p.Estado='inactivo';
    populateSelects(); renderPacientes(); renderNinos();
    closeOv('ov-form-pac'); closeOv('ov-pac'); showToast('\u2705 Paciente archivado');
  } catch(e){showToast('\u26a0\ufe0f Error: '+e.message);}
}

function onRegPaciente() {
  const id=document.getElementById('reg-paciente').value;
  if(!id) return;
  if(regPacientes.includes(id)){showToast('\u26a0\ufe0f Ya est\u00e1 en la lista');document.getElementById('reg-paciente').value='';return;}
  regPacientes.push(id);
  document.getElementById('reg-paciente').value='';
  renderPacChips(); actualizarPreview();
  document.getElementById('type-lbl').style.display='block';
  document.getElementById('type-grid').style.display='grid';
  selectTipo('normal');
}
function renderPacChips() {
  const el=document.getElementById('reg-pac-chips');
  if(!regPacientes.length){el.innerHTML='';return;}
  // C5: esc() on patient ID and name in chips
  el.innerHTML=regPacientes.map(id=>{
    const p=pacientes.find(x=>x.ID===id);
    return `<div class="pac-chip" onclick="quitarPacChip('${esc(id)}')"><span>${esc(p?p.Nombre:'?')}</span><span class="x">\u00d7</span></div>`;
  }).join('');
}
function quitarPacChip(id) {
  regPacientes=regPacientes.filter(x=>x!==id);
  renderPacChips(); actualizarPreview();
  if(!regPacientes.length){
    document.getElementById('reg-preview').classList.remove('show');
    document.getElementById('type-lbl').style.display='none';
    document.getElementById('type-grid').style.display='none';
  }
}
function actualizarPreview() {
  if(!regPacientes.length) return;
  const p=pacientes.find(x=>x.ID===regPacientes[0]); if(!p) return;
  const rem=sesionesRestantes(p),total=parseInt(p.TotalSesiones)||1,done=total-rem;
  const pct=Math.round((done/total)*100);
  // Already using textContent — safe
  document.getElementById('rp-name').textContent=regPacientes.length>1?`${p.Nombre} +${regPacientes.length-1} m\u00e1s`:p.Nombre;
  document.getElementById('rp-lugar').textContent=p.LugarAtencion;
  document.getElementById('rp-dur').textContent=p.DuracionMin+' min';
  document.getElementById('rp-sessions').textContent=rem;
  const bar=document.getElementById('rp-bar');
  bar.style.width=pct+'%';
  bar.className='bar-fill'+(rem<=5?' alert':rem<=10?' warn':'');
  document.getElementById('reg-lugar-show').textContent=p.LugarAtencion;
  autoFin();
  document.getElementById('reg-preview').classList.add('show');
}
function autoFin() {
  const inicioStr=document.getElementById('reg-inicio').value;
  if(!inicioStr||!regPacientes.length) return;
  const p=pacientes.find(x=>x.ID===regPacientes[0]);
  const dur=p?parseInt(p.DuracionMin)||30:30;
  const[h,m]=inicioStr.split(':').map(Number);
  const totalMin=h*60+m+dur;
  const hFin=String(Math.floor(totalMin/60)%24).padStart(2,'0');
  const mFin=String(totalMin%60).padStart(2,'0');
  document.getElementById('reg-fin').value=hFin+':'+mFin;
}

function regGoStep(n) {
  if(n===2&&!regPacientes.length){showToast('\u26a0\ufe0f Selecciona al menos un ni\u00f1o');return;}
  regStep=n;
  ['reg-step1','reg-step2','reg-step3','reg-success'].forEach((id,i)=>{
    document.getElementById(id).style.display=i===n-1?'block':'none';
  });
  for(let i=1;i<=3;i++){
    document.getElementById('rdot'+i).className='step-dot'+(i<n?' done':i===n?' active':'');
  }
  if(n===3) fillSummary();
}
function fillSummary() {
  const nombres=regPacientes.map(id=>{const p=pacientes.find(x=>x.ID===id);return p?p.Nombre.split(' ')[0]:'?';}).join(', ');
  const p=pacientes.find(x=>x.ID===regPacientes[0])||{};
  const fecha=document.getElementById('reg-fecha').value;
  const ini=document.getElementById('reg-inicio').value;
  const fin=document.getElementById('reg-fin').value;
  const tipoLabel=regTipo==='recovery'?'\ud83d\udd04 Recuperaci\u00f3n':regTipo==='cancel'?'\u274c Cancelada':'\ud83d\udccb Normal';
  // All textContent — safe
  document.getElementById('sum-pac').textContent=nombres;
  document.getElementById('sum-tipo').textContent=tipoLabel;
  document.getElementById('sum-fecha').textContent=fmt(fecha);
  document.getElementById('sum-hora').textContent=ini+' \u2014 '+fin;

async function guardarSesion() {
  if(!regPacientes.length) return;
  const fecha=document.getElementById('reg-fecha').value;
  const horaIni=document.getElementById('reg-inicio').value;
  const horaFin=document.getElementById('reg-fin').value;
  const notas=document.getElementById('reg-notas').value;
  const tipo=regTipo==='recovery'?'Recuperacion':regTipo==='cancel'?'Cancelada':'Normal';
  showToast('Guardando sesi\u00f3n(es)...');
  try {
    const promesas=regPacientes.map(pacId=>{
      const p=pacientes.find(x=>x.ID===pacId)||{};
      return apiPost({action:'registrarSesion',data:{
        PacienteID:pacId, Fecha:fecha, HoraInicio:horaIni, HoraFin:horaFin,
        Lugar:p.LugarAtencion||'', Tipo:tipo, Notas:notas,
        TerapistaEmail: currentUser.email
      }});
    });
    const resultados=await Promise.all(promesas);
    const exitos=resultados.filter(r=>r.success).length;
    if(exitos>0){
      const nombres=regPacientes.map(id=>{const p=pacientes.find(x=>x.ID===id);return p?p.Nombre.split(' ')[0]:'?';}).join(', ');
      // textContent — safe
      document.getElementById('reg-success-msg').textContent=`${exitos} sesi\u00f3n(es) guardadas para: ${nombres}.`;
      regGoStep(4); recargarDatos();
    } else { showToast('\u26a0\ufe0f Error al guardar'); }
  } catch(e){showToast('\u26a0\ufe0f Error: '+e.message);}
}

function getSemanasDelMes(year,month) {
  const semanas=[];
  let d=new Date(year,month,1);
  while(d.getMonth()===month){
    const ini=new Date(d),fin=new Date(d);
    fin.setDate(fin.getDate()+6);
    const iniStr=ini.getFullYear()+'-'+String(ini.getMonth()+1).padStart(2,'0')+'-'+String(ini.getDate()).padStart(2,'0');
    const finDate=new Date(Math.min(fin,new Date(year,month+1,0)));
    const label=ini.getDate()+' \u2013 '+finDate.getDate()+' de '+MESES[month];
    semanas.push({inicio:iniStr,fin:finDate.getFullYear()+'-'+String(finDate.getMonth()+1).padStart(2,'0')+'-'+String(finDate.getDate()).padStart(2,'0'),label});
    d.setDate(d.getDate()+7);
  }
  return semanas.reverse();
}
function sesionesEnRango(ini,fin){return sesiones.filter(s=>s.Fecha>=ini&&s.Fecha<=fin);}

function renderReporteSemanal() {
  const el=document.getElementById('reporte-semanal');

  if(!semanas.length){el.innerHTML='<div class="empty">Sin semanas</div>';return;}
  const idx=Math.min(repWeekOffset,semanas.length-1);
  const sem=semanas[idx];
  const todas=sesionesEnRango(sem.inicio,sem.fin);
  const realizadas=todas.filter(s=>s.Tipo==='Normal'||s.Tipo==='Recuperacion');
  const canceladas=todas.filter(s=>s.Tipo==='Cancelada');
  const recuperaciones=todas.filter(s=>s.Tipo==='Recuperacion');
  const horas=calcHoras(realizadas);
  const dias=['Dom','Lun','Mar','Mi\u00e9','Jue','Vie','S\u00e1b'];
  const porDia=[0,0,0,0,0,0,0];
  realizadas.forEach(s=>{porDia[new Date(s.Fecha+'T12:00:00').getDay()]++;});
  // C5: esc() on patient names in session list
  const sesHTML=todas.length?todas.sort((a,b)=>a.Fecha.localeCompare(b.Fecha)||a.HoraInicio.localeCompare(b.HoraInicio)).map(s=>{
    const p=pacientes.find(x=>x.ID===s.PacienteID);
    const nombre=p?p.Nombre:(s.PacienteID?'Archivado':'\u2014');
    return `<div class="session-item">
      <div class="s-dot" style="background:${dotColor(s.Tipo)}"></div>
      <div class="s-info"><div class="s-name">${esc(nombre)}${s.Tipo==='Recuperacion'?' \ud83d\udd04':''}</div>
      <div class="s-sub">${esc(fmt(s.Fecha))} \u00b7 ${esc(s.HoraInicio)}\u2013${esc(s.HoraFin)}</div></div>
      ${chipHTML(s.Tipo)}</div>`;
  }).join(''):'<div class="empty">Sin sesiones esta semana</div>';
  el.innerHTML=`
    <div class="week-nav">
      <button onclick="changeRepWeek(1)" ${idx>=semanas.length-1?'disabled style="opacity:0.3"':''}>‹</button>
      <span>${esc(sem.label)}</span>
      <button onclick="changeRepWeek(-1)" ${idx<=0?'disabled style="opacity:0.3"':''}>›</button>
    </div>
    ${resumenCards(realizadas.length,canceladas.length,recuperaciones.length,horas)}
    <div class="card"><div class="section-lbl" style="margin-top:0">Por d\u00eda</div>
      ${barChart(porDia.map((v,i)=>({val:v,lbl:dias[i]})),()=>'var(--lav)')}
    </div>
    <div class="card" style="margin-top:8px"><div class="section-lbl" style="margin-top:0">Detalle</div>${sesHTML}</div>
    <button class="btn-green" onclick="imprimirReporte('semanal')"><i class="fas fa-file-pdf"></i> Exportar PDF semanal</button>`;
}
function changeRepWeek(dir){
  const semanas=getSemanasDelMes(repYear,repMonth);
  repWeekOffset=Math.max(0,Math.min(semanas.length-1,repWeekOffset+dir));
  renderReporteSemanal();
}

async function renderReporteIngresos() {

  try {
    const y=repYear,m=repMonth;
    const ini=y+'-'+String(m+1).padStart(2,'0')+'-01';
    const fin=y+'-'+String(m+1).padStart(2,'0')+'-'+String(new Date(y,m+1,0).getDate()).padStart(2,'0');
    const semanas=getSemanasDelMes(y,m);
    const sem=semanas[Math.min(repWeekOffset,semanas.length-1)];
    const sesSem=sesiones.filter(s=>s.Fecha>=sem.inicio&&s.Fecha<=sem.fin&&(s.Tipo==='Normal'||s.Tipo==='Recuperacion'));
    const sesMes=sesiones.filter(s=>s.Fecha>=ini&&s.Fecha<=fin&&(s.Tipo==='Normal'||s.Tipo==='Recuperacion'));

    const porAgencia={},porPacienteMes=[];

      const precio=parseFloat(p.Precio)||0,dur=parseInt(p.DuracionMin)||60;
      const agencia=p.Agencia||'Sin agencia',pxs=dur===30?precio/2:precio;
      totalSemana+=sesSem.filter(s=>s.PacienteID===p.ID).length*pxs;

      if(totPacMes>0){
        if(!porAgencia[agencia]) porAgencia[agencia]=0;
        porAgencia[agencia]+=totPacMes;
        porPacienteMes.push({nombre:p.Nombre,agencia,sesiones:sesMes.filter(s=>s.PacienteID===p.ID).length,pxs,total:totPacMes});

        <span style="font-size:13px;font-weight:500;color:var(--text)">$ ${esc(p.total.toFixed(2))}</span></div>`).join('')||'<div class="empty">Sin datos</div>';
    el.innerHTML=`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
        <div class="stat-card"><div class="num" style="color:var(--mint)">$ ${esc(totalSemana.toFixed(2))}</div><div class="lbl">Esta semana</div></div>
        <div class="stat-card"><div class="num" style="color:var(--mint)">$ ${esc(totalMes.toFixed(2))}</div><div class="lbl">Este mes</div></div>
      </div>
      <div class="card" style="margin-bottom:8px"><div class="section-lbl" style="margin-top:0">Por agencia \u2014 ${esc(MESES[m])} ${y}</div>${agenciaHTML}</div>
      <div class="card" style="margin-bottom:8px"><div class="section-lbl" style="margin-top:0">Por paciente \u2014 ${esc(MESES[m])} ${y}</div>${pacienteHTML}</div>
      <button class="btn-green" onclick="imprimirReporte('ingresos')"><i class="fas fa-file-pdf"></i> Exportar PDF de ingresos</button>`;
  } catch(e){el.innerHTML='<div class="empty">Error al calcular</div>';}

function imprimirReporte(tipo) {

  if(tipo==='semanal'||tipo==='mensual'){

    const semanas=getSemanasDelMes(repYear,repMonth);
    const sem=semanas[Math.min(repWeekOffset,semanas.length-1)];
    const ini=esSemanal?sem.inicio:repYear+'-'+String(repMonth+1).padStart(2,'0')+'-01';
    const fin=esSemanal?sem.fin:repYear+'-'+String(repMonth+1).padStart(2,'0')+'-'+String(new Date(repYear,repMonth+1,0).getDate()).padStart(2,'0');
    const todas=sesiones.filter(s=>s.Fecha>=ini&&s.Fecha<=fin);
    const realizadas=todas.filter(s=>s.Tipo==='Normal'||s.Tipo==='Recuperacion');
    const canceladas=todas.filter(s=>s.Tipo==='Cancelada');
    const recuperaciones=todas.filter(s=>s.Tipo==='Recuperacion');
    const horas=calcHoras(realizadas);
    const periodo=esSemanal?sem.label:meses[repMonth]+' '+repYear;
    // C5: esc() in PDF table rows
    const filas=todas.sort((a,b)=>a.Fecha.localeCompare(b.Fecha)||a.HoraInicio.localeCompare(b.HoraInicio)).map(s=>{
      const pac=pacientes.find(x=>x.ID===s.PacienteID);
      const nombre=pac?pac.Nombre:'Archivado';
      const tipoLabel=s.Tipo==='Normal'?'Realizada':s.Tipo==='Recuperacion'?'Recuperaci\u00f3n':'Cancelada';
      return `<tr><td>${esc(fmt(s.Fecha))}</td><td>${esc(s.HoraInicio)} \u2013 ${esc(s.HoraFin)}</td><td>${esc(nombre)}</td><td>${esc(pac?(pac.Agencia||'\u2014'):'\u2014')}</td><td>${esc(tipoLabel)}</td><td>${esc(s.Notas||'')}</td></tr>`;
    }).join('');
    htmlReporte=`<div class="resumen">
      <div class="stat-box"><div class="snum">${realizadas.length}</div><div class="slbl">Realizadas</div></div>
      <div class="stat-box"><div class="snum">${canceladas.length}</div><div class="slbl">Cancelaciones</div></div>
      <div class="stat-box"><div class="snum">${recuperaciones.length}</div><div class="slbl">Recuperaciones</div></div>
      <div class="stat-box"><div class="snum">${horas}h</div><div class="slbl">Horas trabajadas</div></div></div>
      <h2>Detalle \u2014 ${esc(periodo)}</h2>
      <table><thead><tr><th>Fecha</th><th>Horario</th><th>Paciente</th><th>Agencia</th><th>Tipo</th><th>Notas</th></tr></thead>
      <tbody>${filas||'<tr><td colspan="6">Sin sesiones</td></tr>'}</tbody></table>`;
  } else if(tipo==='ingresos'){
    const ini=repYear+'-'+String(repMonth+1).padStart(2,'0')+'-01';
    const fin=repYear+'-'+String(repMonth+1).padStart(2,'0')+'-'+String(new Date(repYear,repMonth+1,0).getDate()).padStart(2,'0');
    const sesMes=sesiones.filter(s=>s.Fecha>=ini&&s.Fecha<=fin&&(s.Tipo==='Normal'||s.Tipo==='Recuperacion'));
    let totalMes=0;const porAgencia={},filasPac=[];
    pacientes.forEach(p=>{
      const precio=parseFloat(p.Precio)||0,dur=parseInt(p.DuracionMin)||60;
      const pxs=dur===30?precio/2:precio,agencia=p.Agencia||'Sin agencia';
      const cnt=sesMes.filter(s=>s.PacienteID===p.ID).length;
      if(cnt>0){const total=cnt*pxs;totalMes+=total;
        if(!porAgencia[agencia]) porAgencia[agencia]=0; porAgencia[agencia]+=total;
        // C5: esc() in PDF rows

async function guardarDiaLibre() {
  const fechaInicio = document.getElementById('dl-fecha').value;
  const fechaFin    = document.getElementById('dl-fecha-fin').value || fechaInicio;
  const notas = document.getElementById('dl-notas').value;
  const tipo  = window._dlTipo || 'Libre';
  if (!fechaInicio) { showToast('\u26a0\ufe0f Selecciona una fecha'); return; }
  if (fechaFin < fechaInicio) { showToast('\u26a0\ufe0f La fecha fin no puede ser anterior al inicio'); return; }
  const fechas = [];
  let current = new Date(fechaInicio + 'T12:00:00');
  const end    = new Date(fechaFin    + 'T12:00:00');
  while (current <= end) {
    const y = current.getFullYear();
    const m = String(current.getMonth()+1).padStart(2,'0');
    const d = String(current.getDate()).padStart(2,'0');
    fechas.push(`${y}-${m}-${d}`);
    current.setDate(current.getDate() + 1);
  }
  showToast(`Guardando ${fechas.length} d\u00eda(s)...`);
  try {
    const resultados = [];
    for (const fecha of fechas) {
      const r = await apiGet({ action:'agregarDiaLibre', Fecha:fecha, Tipo:tipo, Notas:notas, TerapistaEmail: currentUser.email });
      resultados.push(r);
    }
    const exitos = resultados.filter(r => r.success);
    exitos.forEach((r, i) => {
      diasLibres.push({ ID: r.id, Fecha: fechas[i], Tipo: tipo, Notas: notas });
    });
    document.getElementById('ov-dia-libre').remove();
    showToast(`\u2705 ${exitos.length} d\u00eda(s) guardado(s)`);
    renderHoy(); renderMes();
  } catch(e) { showToast('\u26a0\ufe0f Error: ' + e.message); }
}

let currentUser = null;

function checkAuth() {
  // C6: sessionStorage instead of localStorage
  const saved = sessionStorage.getItem('terapista_user');
  const esMobil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (saved) {
    currentUser = JSON.parse(saved);
    if (esMobil) {
      const bioRegistrado = sessionStorage.getItem('terapista_bio');
      if (bioRegistrado && window.PublicKeyCredential) {
        showLogin();
      } else {
        sessionStorage.removeItem('terapista_user');
        currentUser = null;
        showLogin();
      }
    } else {
      showApp();
      checkBiometricoDisponible();
    }
  } else {
    showLogin();
  }
}

  document.getElementById('login-screen').style.display = 'flex';

}

async function registrarBiometrico(overlay) {
  try {
    const challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);
    const credential = await navigator.credentials.create({
      publicKey: {
        challenge,
        rp: { name: 'TerapistaApp' },
        user: { id: new Uint8Array(16), name: currentUser.email, displayName: currentUser.name },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
        timeout: 60000
      }
    });
    if (credential) {
      sessionStorage.setItem('terapista_bio', JSON.stringify({ id: btoa(String.fromCharCode(...new Uint8Array(credential.rawId))) })); // C6
      overlay.remove();
      showToast('\u2705 Biom\u00e9trico activado');
    }
  } catch(e) {
    overlay.remove();
    showToast('\u26a0\ufe0f No se pudo activar: ' + e.message);
  }
}

  try {
    const bioData = JSON.parse(sessionStorage.getItem('terapista_bio')); // C6
    const challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);
    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge,
        allowCredentials: [{ type: 'public-key', id: Uint8Array.from(atob(bioData.id), c => c.charCodeAt(0)) }],
        userVerification: 'required',
        timeout: 60000
      }
    });
    if (assertion) {
      // C2: verify session still valid before granting access
      const savedUser = JSON.parse(sessionStorage.getItem('terapista_user') || '{}');
      if (!savedUser.email) { showToast('\u26a0\ufe0f Sesi\u00f3n inv\u00e1lida, inicia sesi\u00f3n nuevamente'); showLogin(); return; }
      currentUser = savedUser;
      showApp();
    }
  } catch(e) {
    showToast('\u26a0\ufe0f Error biom\u00e9trico: ' + e.message);
  }
}

function initMapsAutocomplete() {

  const autocomplete = new google.maps.places.Autocomplete(input, {

    const place = autocomplete.getPlace();
    if (place && place.formatted_address) {
      input.value = place.name || place.formatted_address;

  });
}

// ── GOOGLE CALENDAR SYNC ──
const CAL_API = 'https://www.googleapis.com/calendar/v3';

function getFechaFinEscolar() {
  const hoy = new Date();
  const anio = hoy.getMonth() >= 6 ? hoy.getFullYear() + 1 : hoy.getFullYear();
  return new Date(anio, 5, 30, 23, 59, 59);
}

async function borrarEventosFuturos(accessToken) {
  const hoy = new Date().toISOString();
  const fin = getFechaFinEscolar().toISOString();
  let pageToken = null;
  const idsABorrar = [];
  do {
    let url = `${CAL_API}/calendars/primary/events?timeMin=${hoy}&timeMax=${fin}&privateExtendedProperty=source%3DTerapistaApp&maxResults=250`;
    if (pageToken) url += `&pageToken=${pageToken}`;
    const res = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken } });
    const data = await res.json();
    (data.items || []).forEach(e => idsABorrar.push(e.id));
    pageToken = data.nextPageToken || null;
  } while (pageToken);
  for (const id of idsABorrar) {
    await fetch(`${CAL_API}/calendars/primary/events/${id}`, {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + accessToken }
    });
  }
  return idsABorrar.length;
}

async function crearEventosDesdePlan(accessToken) {
  const hoy = new Date();
  const finEscolar = getFechaFinEscolar();
  const DIAS_SEMANA = [1, 2, 3, 4, 5, 6];
  const creados = [];
  for (const [diaIdx, entradas] of Object.entries(planData)) {
    const diaSemana = DIAS_SEMANA[parseInt(diaIdx)];
    if (!entradas || !entradas.length) continue;
    for (const entrada of entradas) {
      if (!entrada.hora) continue;
      const [hh, mm] = entrada.hora.split(':').map(Number);
      let fechaBase = new Date(hoy);
      const diaActual = fechaBase.getDay() === 0 ? 7 : fechaBase.getDay();
      let diff = diaSemana - diaActual;
      if (diff < 0) diff += 7;
      if (diff === 0 && (hoy.getHours() > hh || (hoy.getHours() === hh && hoy.getMinutes() >= mm))) diff = 7;
      fechaBase.setDate(fechaBase.getDate() + diff);
      let fechaEvento = new Date(fechaBase);
      while (fechaEvento <= finEscolar) {
        const inicio = new Date(fechaEvento);
        inicio.setHours(hh, mm, 0, 0);
        const pac = pacientes.find(p => p.ID === entrada.pacId);
        const durMin = pac ? (parseInt(pac.DuracionMin) || 30) : 30;
        const fin = new Date(inicio.getTime() + durMin * 60000);
        const evento = {
          summary: `\ud83d\udc76 ${entrada.nombre}`,
          location: entrada.lugar || '',
          description: `Sesi\u00f3n de terapia del habla\nLugar: ${entrada.lugar || '\u2014'}`,
          start: { dateTime: inicio.toISOString(), timeZone: 'America/Panama' },
          end:   { dateTime: fin.toISOString(),   timeZone: 'America/Panama' },
          extendedProperties: { private: { source: 'TerapistaApp' } },
          colorId: '1'
        };
        await fetch(`${CAL_API}/calendars/primary/events`, {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
          body: JSON.stringify(evento)
        });
        creados.push(entrada.nombre);
        fechaEvento.setDate(fechaEvento.getDate() + 7);
      }
    }
  }
  return creados.length;
}

async function sincronizarCalendario() {
  if (!currentUser) { showToast('\u26a0\ufe0f Debes estar autenticado'); return; }
  if (!_calendarToken) { showToast('\u26a0\ufe0f Vuelve a iniciar sesi\u00f3n para sincronizar'); return; } // A1: module var
  showToast('\ud83d\udcc5 Sincronizando calendario...');
  try {
    const borrados = await borrarEventosFuturos(_calendarToken);
    const creados  = await crearEventosDesdePlan(_calendarToken);
    showToast(`\u2705 Calendario actualizado \u2014 ${creados} eventos creados`);
  } catch(e) {
    showToast('\u26a0\ufe0f Error: ' + e.message);
  }
}

let terapistaActiva = null;

async function initAdmin() {
  const r = await apiGet({ action: 'getTerapistas' });
  if (!r.success || !r.data.length) { showToast('\u26a0\ufe0f No hay terapistas registradas'); return; }
  // C5: esc() on terapista emails and names
  const opts = r.data.map(t => `<option value="${esc(t.email)}">${esc(t.nombre || t.email)}</option>`).join('');
  const selector = document.createElement('div');
  selector.id = 'admin-bar';
  selector.style.cssText = 'background:var(--lav);color:white;padding:8px 16px;display:flex;align-items:center;gap:10px;font-size:13px;flex-shrink:0';
  selector.innerHTML = `
    <span>\ud83d\udc41\ufe0f Viendo como:</span>
    <select id="admin-terapista-sel" style="flex:1;padding:6px 10px;border-radius:8px;border:none;font-family:Georgia,serif;font-size:13px;color:var(--text)">
      ${opts}
    </select>
    <button onclick="cambiarTerapista()" style="background:white;color:var(--lav);border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-family:Georgia,serif;font-size:12px;font-weight:500">Ver</button>
  `;
  document.querySelector('.desktop-main').prepend(selector);
  terapistaActiva = r.data[0].email;
  await init();
}

async function cambiarTerapista() {
  const sel = document.getElementById('admin-terapista-sel');
  terapistaActiva = sel.value;
  showToast('\ud83d\udd04 Cargando datos...');
  await init();
}
